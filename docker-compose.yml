services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aipm-postgres
    environment:
      POSTGRES_DB: aipm
      POSTGRES_USER: aipm
      POSTGRES_PASSWORD: aipm
    ports:
      - "5432:5432"
    volumes:
      - aipm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipm -d aipm"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  aipm-pgdata:
